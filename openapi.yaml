openapi: 3.1.0
info:
  title: JARVIS Bridge
  version: 1.0.0
  description: Executes only allowlisted phone actions through a private MacroDroid webhook.
servers:
  - url: https://REPLACE-WITH-YOUR-DEPLOYED-HOST
paths:
  /health:
    get:
      operationId: checkJarvisBridge
      summary: Check JARVIS Bridge status
      security: []
      responses:
        '200':
          description: Service status
  /v1/actions/execute:
    post:
      operationId: executeApprovedPhoneAction
      summary: Execute an explicitly approved phone action
      description: Only open_whatsapp is supported. Obtain explicit user confirmation in the conversation before calling.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, confirmation, request_id]
              properties:
                action: {type: string, enum: [open_whatsapp]}
                confirmation: {type: boolean, enum: [true]}
                request_id: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$'}
      responses:
        '200': {description: Request sent or duplicate request safely ignored}
        '401': {description: Unauthorized}
        '403': {description: Confirmation missing}
        '502': {description: MacroDroid webhook failed}
        '503': {description: Integration or storage not configured}
        '504': {description: MacroDroid timed out}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
